<style>
:root{--bg:#0d0f12;--panel:#15181d;--panel-2:#1b1f25;--line:#262a31;--line-2:#363b44;--fg:#f3f1ec;--muted:#a3a19b;--gold:#e8c35a;--gold-2:#f3dc95;--ok:#3ddc84;--warn:#ffc93c;--bad:#ff5a6e;--info:#7ab8ff;color-scheme:dark}
*{box-sizing:border-box}html,body{overflow-x:clip}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#1d1a12 0,var(--bg) 55%);color:var(--fg);font:15px/1.5 'Montserrat',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:.6rem;padding-block:.65rem}
.brand{display:flex;align-items:center;gap:.55rem;flex:1;min-width:0}.brand svg{width:1.4rem;height:1.75rem;flex:none;fill:var(--gold)}
.brand b{font-family:'Unbounded',sans-serif;font-weight:800;font-size:1.02rem;letter-spacing:.02em;white-space:nowrap}.brand b span{color:var(--gold)}
.lang{display:flex;gap:.15rem}.lang button{background:none;border:0;color:var(--muted);font-family:inherit;font-weight:700;font-size:.72rem;line-height:1;letter-spacing:.06em;padding:.35rem .3rem;cursor:pointer;border-radius:.3rem}.lang button[aria-pressed=true]{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line-2);background:var(--panel);color:inherit;border-radius:.6rem;padding:.65rem 1rem;font-family:inherit;font-weight:700;font-size:.86rem;line-height:1.1;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.sm{padding:.38rem .6rem;font-size:.76rem;border-radius:.45rem}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:var(--gold);color:#16130a}
.btn.ghost{background:none}.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:none}
.btn:disabled{opacity:.55;cursor:default}
main .wrap{padding-block:1.3rem calc(2.5rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:1rem}
h1{font-family:'Unbounded',sans-serif;font-size:1.45rem;line-height:1.2;margin:0;font-weight:800}
h2{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 .75rem}
.sub{color:var(--muted);margin:.35rem 0 0;font-size:.92rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.05rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}.grid .full{grid-column:1/-1}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:.3rem;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
input,select,textarea{font:inherit;font-size:16px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:.6rem;padding:.65rem .75rem;color:var(--fg);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--gold) 60%,transparent);outline-offset:1px;border-color:var(--gold)}
textarea{min-height:4.5rem;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}.seg label{display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line-2);border-radius:.6rem;padding:.6rem .5rem;font-weight:700;font-size:.84rem;cursor:pointer;background:var(--panel-2)}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px}.seg label:has(input:checked){border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel-2))}
.chk{display:flex;gap:.65rem;align-items:flex-start;font-size:.88rem;line-height:1.4;padding:.55rem 0;border-top:1px solid var(--line)}.chk:first-of-type{border-top:0}
.chk input{width:1.15rem;height:1.15rem;flex:none;margin-top:.12rem;accent-color:var(--gold)}
.chk small{display:block;color:var(--muted);font-size:.78rem}
.req{color:var(--gold)}
.note{color:var(--muted);font-size:.8rem;margin:0}
.msg{min-height:1.2rem;font-size:.86rem;font-weight:600}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.hero{display:flex;gap:.9rem;align-items:center}
.ava{width:3.4rem;height:3.4rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#2a2416,#14120c);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold);font:800 1.15rem 'Unbounded',sans-serif;flex:none}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border-radius:2rem;font-size:.74rem;font-weight:800;letter-spacing:.02em;border:1px solid currentColor}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.info{color:var(--info)}.pill.bad{color:var(--bad)}.pill.gold{color:var(--gold)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin-top:.9rem}
.kv div{background:var(--panel-2);border:1px solid var(--line);border-radius:.7rem;padding:.65rem .7rem;min-width:0}
.kv b{display:block;font:800 1.15rem/1.2 'Unbounded',sans-serif;overflow-wrap:anywhere}.kv span{display:block;color:var(--muted);font-size:.72rem;margin-top:.15rem}
@media (max-width:420px){.kv{grid-template-columns:1fr 1fr}}
.soon{display:flex;gap:.75rem;align-items:flex-start}.soon i{font-style:normal;font-size:1.3rem;line-height:1}
.actions{display:flex;flex-wrap:wrap;gap:.5rem}
.ld{display:grid;place-items:center;min-height:40vh;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:.74rem;padding-bottom:1rem}
.foot a{color:inherit}
[hidden]{display:none!important}
.ver{display:inline-flex;align-items:center;gap:.4rem;border:1px solid #3ddc84;color:#3ddc84;border-radius:2rem;padding:.2rem .65rem .2rem .3rem;font-weight:800;font-size:.76rem}.ver b{display:grid;place-items:center;width:1.2rem;height:1.2rem;border-radius:50%;background:#3ddc84;color:#0b0c0f;font-size:.72rem}.ver img{height:.95rem;width:auto;display:block}
.ava.ph{position:relative;cursor:pointer;overflow:hidden}.ava.ph img{width:100%;height:100%;object-fit:cover;border-radius:50%}.ava.ph i{position:absolute;right:-.1rem;bottom:-.1rem;font-style:normal;font-size:.85rem;background:#15181d;border:1px solid var(--line-2);border-radius:50%;width:1.5rem;height:1.5rem;display:grid;place-items:center}
.warnc{border-color:rgba(255,201,60,.55)!important;color:#ffc93c;font-size:.88rem}
.medals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.55rem}.md{display:flex;flex-direction:column;align-items:center;gap:.15rem;background:var(--panel-2);border:1px solid var(--line);border-radius:.8rem;padding:.7rem .3rem}.md i{font-style:normal;font-size:2rem;line-height:1;filter:drop-shadow(0 4px 10px rgba(232,195,90,.35))}.md b{font:800 1.2rem 'Unbounded',sans-serif}.md.off{opacity:.35;filter:grayscale(1)}
.rec{margin:.7rem 0 0}.rec b{font-family:'Unbounded',sans-serif}.titles{list-style:none;padding:0;margin:.6rem 0 0;display:grid;gap:.3rem}
.sh{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}.sh h2{margin:0}
.it{border-top:1px solid var(--line);padding:.65rem 0}.it:first-of-type{border-top:0}.it-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}.it-h b{display:flex;align-items:center;gap:.45rem}.it-s{color:var(--muted);font-size:.82rem;margin-top:.15rem;overflow-wrap:anywhere}.it-s a,.it-r a{color:var(--gold)}
.it-r{margin-top:.3rem;font-size:.9rem}.res{font-weight:800}.res.w{color:#3ddc84}.res.l{color:var(--bad)}.res.d{color:var(--muted)}.res.p{color:var(--gold)}
.it-d{margin:.35rem 0 0;font-size:.86rem;color:#d6d3cb;white-space:pre-wrap}.it-n{margin:.35rem 0 0;font-size:.8rem;color:#ffc93c}.it-a{display:flex;gap:.4rem;margin-top:.45rem}.it-a .sp{flex:1}
.cl-i{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:.4rem;background:var(--panel-2);border:1px solid var(--line-2);color:var(--gold);font-size:.8rem}
.curclub{display:flex;align-items:center;gap:.8rem;background:var(--panel-2);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:.8rem;padding:.7rem .8rem;margin-bottom:.4rem;flex-wrap:wrap}.curclub img{height:2rem;width:auto}.curclub div{flex:1;min-width:8rem}.curclub small{display:block;color:var(--muted);font-size:.78rem}
.iform{background:var(--panel-2)!important;margin:.4rem 0}.lbl{font-size:.78rem;font-weight:700;color:var(--muted);display:block;margin-bottom:.3rem}

.globe{position:relative;width:100%;aspect-ratio:1/1;max-height:min(72vh,560px);margin:0 auto}
.club{display:flex;gap:.9rem;align-items:center}
.club .flag{font-size:1.7rem;line-height:1}
.club b{display:block;font-size:1.02rem}.club small{display:block;color:var(--muted);font-size:.8rem}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.45rem}.tags span{font-size:.7rem;font-weight:700;border:1px solid var(--line-2);border-radius:2rem;padding:.12rem .5rem;color:var(--muted)}
@media (max-width:420px){.club{flex-wrap:wrap}.club .btn{width:100%}}
.clubchip{display:flex;align-items:center;gap:.6rem;background:var(--panel-2);border:1px solid var(--gold);border-radius:.6rem;padding:.55rem .7rem;font-weight:700}
.clubchip span{min-width:0}.clubchip span:nth-child(2){flex:1}.clubchip small{display:block;color:var(--muted);font-weight:600;font-size:.76rem}

  const w=C.filter(c=>c.rtype==='bout'&&c.res==='W').length,l=C.filter(c=>c.rtype==='bout'&&c.res==='L').length,d=C.filter(c=>c.rtype==='bout'&&c.res==='D').length;
  if(!g&&!s&&!b&&!Ti.length&&!w&&!l&&!d)return `<section class="card"><h2>${t('medH')}</h2><p class="note">${t('medE')}</p></section>`;
  return `<section class="card"><h2>${t('medH')}</h2><div class="medals">${[['g',g,'🥇'],['s',s,'🥈'],['b',b,'🥉']].map(([k,n,i])=>`<div class="md ${k} ${n?'':'off'}"><i>${i}</i><b>${n}</b></div>`).join('')}<div class="md t ${Ti.length?'':'off'}"><i>🏆</i><b>${Ti.length}</b></div></div>
    ${w+l+d?`<p class="rec">${t('record')}: <b>${w}-${l}-${d}</b> <span class="note">(${t('recW')}-${t('recL')}-${t('recD')})</span></p>`:''}
    ${Ti.length?`<ul class="titles">${Ti.map(x=>`<li>🏆 ${esc(x.data.name)}${x.data.year?` · ${esc(x.data.year)}`:''}${x.data.org?` · <span class="note">${esc(x.data.org)}</span>`:''}</li>`).join('')}</ul>`:''}
    <p class="note" style="margin:.6rem 0 0">${t('medN')}</p></section>`}
const stChip=i=>i.status==='ok'?`<span class="pill ok">✓ ${t('itOk')}</span>`:i.status==='rejected'?`<span class="pill bad">${t('itNo')}</span>`:`<span class="pill gold">${t('itPend')}</span>`;
function resOf(c){if(c.rtype==='bout')return `<span class="res ${c.res==='W'?'w':c.res==='L'?'l':'d'}">${t('res_'+c.res)}</span>${c.method?` · ${esc(c.method)}`:''}${c.opp?` · ${t('vs')} ${esc(c.opp)}`:''}`;
  return c.pos==='part'?`<span class="res d">${t('part')}</span>`:`<span class="res p">${['','🥇','🥈','🥉'][+c.pos]} ${c.pos} ${t('placeN')}</span>`}
function itemRow(i){const d=i.data,act=`<span class="sp"></span><button class="btn sm" data-ied="${esc(i.id)}">${t('ed')}</button><button class="btn sm danger" data-idel="${esc(i.id)}">✕</button>`;
  if(i.kind==='comp')return `<div class="it"><div class="it-h"><b>${esc(d.name)}</b>${stChip(i)}</div><div class="it-s">${esc(d.date)}${d.place?' · '+esc(d.place):''}${d.org?' · '+esc(d.org):''}${d.level?' · '+esc(t('lv_'+d.level)):''}${d.disc?' · '+esc(dn(d.disc)):''}${d.weight?' · '+esc(d.weight):''}</div>
    <div class="it-r">${resOf(d)}${d.link?` · <a href="${esc(d.link)}" target="_blank" rel="noopener nofollow">${t('linkL')} ↗</a>`:''}</div>${d.desc?`<p class="it-d">${esc(d.desc)}</p>`:''}${i.note?`<p class="it-n">${t('clubNote')}: ${esc(i.note)}</p>`:''}<div class="it-a">${act}</div></div>`;
  if(i.kind==='title')return `<div class="it"><div class="it-h"><b>🏆 ${esc(d.name)}</b>${stChip(i)}</div><div class="it-s">${[d.year,d.org].filter(Boolean).map(esc).join(' · ')}${d.link?` · <a href="${esc(d.link)}" target="_blank" rel="noopener nofollow">${t('linkL')} ↗</a>`:''}</div>${i.note?`<p class="it-n">${t('clubNote')}: ${esc(i.note)}</p>`:''}<div class="it-a">${act}</div></div>`;
  if(i.kind==='club')return `<div class="it"><div class="it-h"><b><span class="cl-i">${esc((d.name||'?')[0])}</span>${esc(d.name)}</b>${stChip(i)}</div><div class="it-s">${d.city?esc(d.city)+' · ':''}${esc(d.from||'?')} — ${esc(d.to||t('now'))}</div>${i.note?`<p class="it-n">${t('clubNote')}: ${esc(i.note)}</p>`:''}<div class="it-a">${act}</div></div>`;
  return `<div class="it"><div class="it-h"><b>🔗 ${esc(d.site||new URL(d.url).hostname)}</b>${stChip(i)}</div><div class="it-s"><a href="${esc(d.url)}" target="_blank" rel="noopener nofollow">${esc(d.url)}</a></div><div class="it-a">${act}</div></div>`}
let OPEN=null;
function itemForm(kind,i){const d=(i&&i.data)||{},lv=d.level||'club';
  const F={comp:`<div class="grid"><label class="f">${t('c_date')} *<input type="date" id="i_date" value="${esc(d.date)}" max="${new Date().toISOString().slice(0,10)}"></label><label class="f">${t('c_name')} *<input id="i_name" maxlength="120" value="${esc(d.name)}" placeholder="${esc(t('c_nameP'))}"></label>
      <label class="f">${t('c_place')}<input id="i_place" maxlength="80" value="${esc(d.place)}" placeholder="${esc(t('c_placeP'))}"></label><label class="f">${t('c_org')}<input id="i_org" maxlength="80" value="${esc(d.org)}" placeholder="UFC, IBJJF, WAKO…"></label>
      <label class="f">${t('disc')}<select id="i_disc">${(D.discs||[]).map(x=>`<option value="${esc(x)}" ${x===(d.disc||D.profile.disc)?'selected':''}>${esc(dn(x))}</option>`).join('')}</select></label><label class="f">${t('weight')}<input id="i_weight" maxlength="30" value="${esc(d.weight)}" placeholder="${esc(t('weightP'))}"></label>
      <label class="f full">${t('c_level')}<select id="i_level">${LVL.map(x=>`<option value="${x}" ${x===lv?'selected':''}>${esc(t('lv_'+x))}</option>`).join('')}</select></label>
      <div class="f full"><span class="lbl">${t('c_rtype')}</span><div class="seg"><label><input type="radio" name="i_rt" value="place" ${d.rtype!=='bout'?'checked':''}>${t('rt_place')}</label><label><input type="radio" name="i_rt" value="bout" ${d.rtype==='bout'?'checked':''}>${t('rt_bout')}</label></div></div>
      <label class="f full" data-rt="place">${t('c_pos')}<select id="i_pos">${['1','2','3','part'].map(x=>`<option value="${x}" ${x===(d.pos||'1')?'selected':''}>${x==='part'?esc(t('part')):['','🥇','🥈','🥉'][+x]+' '+x+' '+esc(t('placeN'))}</option>`).join('')}</select></label>
      <label class="f" data-rt="bout">${t('c_res')}<select id="i_res">${['W','L','D'].map(x=>`<option value="${x}" ${x===(d.res||'W')?'selected':''}>${esc(t('res_'+x))}</option>`).join('')}</select></label>
      <label class="f" data-rt="bout">${t('c_method')}<input id="i_method" maxlength="40" value="${esc(d.method)}" placeholder="${esc(t('c_methodP'))}"></label>
      <label class="f full" data-rt="bout">${t('c_opp')}<input id="i_opp" maxlength="80" value="${esc(d.opp)}"></label>
      <label class="f full">${t('c_link')}<input id="i_link" type="url" maxlength="300" value="${esc(d.link)}" placeholder="https://"></label>
      <label class="f full">${t('c_desc')}<textarea id="i_desc" maxlength="500" placeholder="${esc(t('c_descP'))}">${esc(d.desc)}</textarea></label></div>`,
    title:`<div class="grid"><label class="f full">${t('ti_name')} *<input id="i_name" maxlength="120" value="${esc(d.name)}" placeholder="${esc(t('ti_nameP'))}"></label><label class="f">${t('ti_year')}<input id="i_year" inputmode="numeric" maxlength="4" value="${esc(d.year)}"></label><label class="f">${t('c_org')}<input id="i_org" maxlength="80" value="${esc(d.org)}"></label><label class="f full">${t('c_link')}<input id="i_link" type="url" maxlength="300" value="${esc(d.link)}" placeholder="https://"></label></div>`,
    club:`<div class="grid"><label class="f full">${t('cl_name')} *<input id="i_name" maxlength="80" value="${esc(d.name)}"></label><label class="f full">${t('city')}<input id="i_city" maxlength="60" value="${esc(d.city)}"></label><label class="f">${t('cl_from')}<input type="month" id="i_from" value="${esc(d.from)}"></label><label class="f">${t('cl_to')}<input type="month" id="i_to" value="${esc(d.to)}"></label></div>`,
    link:`<div class="grid"><label class="f full">${t('ln_url')} *<input id="i_url" type="url" maxlength="300" value="${esc(d.url)}" placeholder="https://www.tapology.com/fightcenter/fighters/…"></label><label class="f full">${t('ln_site')}<input id="i_site" maxlength="40" value="${esc(d.site)}" placeholder="Tapology, Sherdog, Smoothcomp, BJJ Heroes…"></label></div><p class="note" style="margin:.5rem 0 0">${t('ln_n')}</p>`};
  return `<div class="card iform" id="iform"><h2>${i?t('ed'):t('add')} · ${t('k_'+kind)}</h2>${F[kind]}<div class="msg" id="im" role="status"></div><div class="actions"><button class="btn gold" id="isave" type="button" style="flex:1">${t('toClub')}</button><button class="btn" id="icx" type="button">${t('cancel')}</button></div></div>`}
function bindItemForm(kind,id){const v=x=>{const e=$(x);return e?e.value.trim():''};
  const syncRt=()=>{const rt=document.querySelector('input[name=i_rt]:checked')?.value;document.querySelectorAll('[data-rt]').forEach(e=>e.hidden=e.dataset.rt!==rt)};document.querySelectorAll('input[name=i_rt]').forEach(r=>r.onchange=syncRt);syncRt();
  $('#icx').onclick=()=>{OPEN=null;render()};
  $('#isave').onclick=async()=>{const m=$('#im'),b=$('#isave');let data;
    if(kind==='comp')data={date:v('#i_date'),name:v('#i_name'),place:v('#i_place'),org:v('#i_org'),disc:v('#i_disc'),weight:v('#i_weight'),level:v('#i_level'),rtype:document.querySelector('input[name=i_rt]:checked')?.value,pos:v('#i_pos'),res:v('#i_res'),method:v('#i_method'),opp:v('#i_opp'),link:v('#i_link'),desc:v('#i_desc')};
    if(kind==='title')data={name:v('#i_name'),year:v('#i_year'),org:v('#i_org'),link:v('#i_link')};
    if(kind==='club')data={name:v('#i_name'),city:v('#i_city'),from:v('#i_from'),to:v('#i_to')};
    if(kind==='link')data={url:v('#i_url'),site:v('#i_site')};
    b.disabled=true;try{D=await apiP('/api/my/item',{kind,id,data});OPEN=null;render();toastMy(t('sentClub'))}catch(e){m.textContent=t('itErr');m.className='msg bad'}finally{b.disabled=false}}}
async function apiP(u,body){const r=await fetch(u,{method:'POST',cache:'no-store',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'server'),{code:j.error});return j}
function toastMy(x){let e=$('#tst');if(!e){e=document.createElement('div');e.id='tst';e.setAttribute('role','status');e.style.cssText='position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:#e8c35a;color:#16130a;font-weight:800;padding:.6rem 1rem;border-radius:.6rem;z-index:50;max-width:calc(100% - 32px)';document.body.appendChild(e)}e.textContent=x;e.hidden=false;clearTimeout(toastMy.t);toastMy.t=setTimeout(()=>e.hidden=true,2600)}
function sec(kind,title,hint){const L=(D.items||[]).filter(i=>i.kind===kind).sort((a,b)=>String((b.data.date||b.data.from||b.data.year||''))<String((a.data.date||a.data.from||a.data.year||''))?-1:1);
  const open=OPEN&&OPEN.kind===kind;
  return `<section class="card" id="sec-${kind}"><div class="sh"><h2>${title}</h2>${open?'':`<button class="btn sm gold" data-add="${kind}">＋ ${t('add')}</button>`}</div>${hint?`<p class="note" style="margin:-.3rem 0 .6rem">${hint}</p>`:''}
    ${open&&!OPEN.id?itemForm(kind):''}${L.map(i=>open&&OPEN.id===i.id?itemForm(kind,i):itemRow(i)).join('')||(open?'':`<p class="note">${t('empty_'+kind)}</p>`)}</section>`}
function clubsSec(){const c=D.club||{};
  return `<section class="card" id="sec-club"><div class="sh"><h2>${t('clubsH')}</h2>${OPEN&&OPEN.kind==='club'?'':`<button class="btn sm gold" data-add="club">＋ ${t('pastClub')}</button>`}</div>
    <div class="curclub">${c.logo?`<img src="${esc(c.logo)}" alt="${esc(c.name)}">`:`<b>${esc(c.name||'')}</b>`}<div><b>${esc(c.name||'')}</b><small>${esc(cityOf(c))} · ${t('curClub')}${D.verAt?' · ✓ '+t('since')+' '+new Date(D.verAt).toLocaleDateString({ru:'ru-RU',en:'en-GB',tr:'tr-TR'}[L],{month:'short',year:'numeric'}):''}</small></div>${D.verified?'<span class="pill ok">✓ Verified</span>':''}</div>
    ${(()=>{const L2=(D.items||[]).filter(i=>i.kind==='club');const open=OPEN&&OPEN.kind==='club';return (open&&!OPEN.id?itemForm('club'):'')+L2.map(i=>open&&OPEN.id===i.id?itemForm('club',i):itemRow(i)).join('')})()}
    <p class="note" style="margin:.6rem 0 0">${t('clubsN')}</p></section>`}
function home(){const p=D.profile,a=ageOf(p.dob),ini=((p.first||'')[0]||'')+((p.last||'')[0]||'');
  const P=D.pending?Object.keys(D.pending):[];
  return `<section class="hero"><label class="ava ph" title="${esc(t('photo'))}">${D.photo?`<img src="${esc(D.photo)}" alt="">`:esc(ini.toUpperCase())}<input type="file" accept="image/*" id="phf" hidden><i aria-hidden="true">📷</i></label>
    <div style="min-width:0"><h1>${esc(p.first)} ${esc(p.last)}</h1><p class="sub">${esc(dn(p.disc))}${a!=null?` · ${a}`:''}${p.weight?` · ${esc(p.weight)}`:''}${p.belt?` · ${esc(p.belt)}`:''}</p><div style="margin-top:.45rem">${badge()}</div></div></section>
  ${D.note?`<div class="card warnc">⚠️ ${esc(D.note)}</div>`:''}
  ${P.length?`<div class="card warnc">⏳ ${t('pendP')}: <b>${P.map(k=>esc(t('f_'+k)||k)).join(', ')}</b></div>`:''}
  ${medals()}
  ${statusCard()}
  ${clubsSec()}
  ${sec('comp',t('compH'),t('compN'))}
  ${sec('title',t('titleH'))}
  ${sec('link',t('linkH'),t('ln_n'))}
  <a class="card" href="/world/" style="display:flex;align-items:center;gap:.8rem;text-decoration:none;color:inherit;border-color:color-mix(in srgb,var(--gold) 55%,transparent)"><span style="font-size:1.6rem" aria-hidden="true">✦</span><span style="flex:1"><b style="font-family:Unbounded,sans-serif">My PIT World</b><small style="display:block;color:var(--muted)">${t('worldP')}</small></span><span style="color:var(--gold);font-weight:800">→</span></a>
  <section class="card"><h2>${t('profH')}</h2><p style="margin:0">${esc(p.last)} ${esc(p.first)}<br><span class="note">${esc(D.email)} · ${esc(p.phone)} · ${fd(p.dob)}${p.city?' · '+esc(p.city):''}</span></p>
    <div class="actions" style="margin-top:.9rem"><button class="btn" id="ed" type="button">${t('edit')}</button><button class="btn danger" id="dl" type="button">${t('del')}</button></div>
    <p class="note" style="margin-top:.8rem">${t('privacy')}</p></section>`}
function bindHome(){
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{OPEN={kind:b.dataset.add};render();setTimeout(()=>$('#iform')?.scrollIntoView({behavior:'smooth',block:'center'}),50)});
  document.querySelectorAll('[data-ied]').forEach(b=>b.onclick=()=>{const i=D.items.find(x=>x.id===b.dataset.ied);OPEN={kind:i.kind,id:i.id};render();setTimeout(()=>$('#iform')?.scrollIntoView({behavior:'smooth',block:'center'}),50)});
  document.querySelectorAll('[data-idel]').forEach(b=>b.onclick=async()=>{if(!b.dataset.sure){b.dataset.sure=1;b.textContent=t('delQ');return}try{D=await apiP('/api/my/item/del',{id:b.dataset.idel});render()}catch(e){}});
  if(OPEN&&$('#iform'))bindItemForm(OPEN.kind,OPEN.id);
  const pf=$('#phf');if(pf)pf.onchange=async()=>{const f=pf.files[0];if(!f)return;try{const blob=await shrinkImg(f,900);const r=await fetch('/api/my/photo',{method:'POST',headers:{'content-type':'image/jpeg'},body:blob,credentials:'same-origin'});const j=await r.json();if(!r.ok)throw 0;D=j;render();toastMy(D.verified?t('sentClub'):t('saved'))}catch(e){toastMy(t('itErr'))}}}
function shrinkImg(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.86)};img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}

function picker(){const cl=D.clubs||[];
  return `<div><h1>${t('pickH')}</h1><p class="sub">${t('pickP')}</p></div>
  <div class="globe" id="gl"></div>
  ${cl.map(c=>`<section class="card club"><span class="flag" aria-hidden="true">${FLAG[c.country]||'🥋'}</span><div style="flex:1;min-width:0"><b>${esc(c.name)}</b><small>${esc(cityOf(c))}</small><div class="tags">${(c.discs||[]).map(d=>`<span>${esc(dn(d))}</span>`).join('')}</div></div><button class="btn gold" type="button" data-pick="${esc(c.id)}">${t('mine')}</button></section>`).join('')}
  <p class="note">${t('soon')}</p>`}
function render(){applyLang();if(!D)return;const v=$('#v');if(GL){GL.destroy();GL=null}if(FD){FD.destroy();FD=null}
  const who=`<p class="note" style="margin:0">${t('as')} <b style="color:var(--fg)">${esc(D.email)}</b> · <a href="/auth/logout?next=/my/" style="color:var(--gold)">${t('notYou')}</a></p>`;
  if(D.profile&&!D.profile.consentData&&!PICK){PICK=D.profile.club}
  if((!D.profile||EDIT)&&!PICK){v.innerHTML=who+picker();const pick=id=>{PICK=id;render();window.scrollTo({top:0,behavior:'smooth'})};
    try{GL=PITGlobe.mount($('#gl'),{clubs:(D.clubs||[]).map(c=>({...c,city:cityOf(c)})),focus:(D.profile&&D.profile.club)||null,onPick:c=>pick(c.id),label:t('pickH')})}catch(e){$('#gl').hidden=true}
    v.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(b.dataset.pick));return}
  if(!D.profile||EDIT||!D.profile.consentData){v.innerHTML=who+form();bindForm();return}
  v.innerHTML=who+home();bindHome();
  $('#ed').onclick=()=>{EDIT=true;PICK=D.profile.club;render();window.scrollTo({top:0})};
  $('#dl').onclick=async e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure=1;b.textContent=t('delSure');return}b.disabled=true;try{await api({method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({delete:true})});location.replace('/login?next=%2Fmy%2F')}catch(err){b.disabled=false}}}
applyLang();
api().then(j=>{D=j;render()}).catch(e=>{if(e.message!=='auth')$('#v').innerHTML='<p class="msg bad">'+esc(t('err').server)+'</p>'});
</script>
</body>
</html>
