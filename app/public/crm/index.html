<script>
"use strict";
/* ===== данные: db (общая база клуба), без демо ===== */
const S={leads:[],products:[],events:[],audit:{},settings:null,ov:null,cart:{},freezes:[],expenses:[],expOpen:false,diary:[],members:[],payments:[],visits:{},tariffs:null,ready:{m:false,p:false,v:false,t:false},tab:'today',q:'',flt:'all',ciq:'',month:null,open:null,drMode:'view',canWrite:true};
const DEF_TARIFFS=[
 {key:'grp12',name:'Групповые · 12 занятий',price:4500,sessions:12,kind:'group',disc:['MMA','Бокс','BJJ','Кикбоксинг','Капоэйра']},
 {key:'kids12',name:'Дети MMA · 12 занятий',price:3500,sessions:12,kind:'kids',disc:['MMA']},
 {key:'ind10m',name:'Индивидуальные MMA/BJJ · 10 сеансов',price:15000,sessions:10,kind:'ind',disc:['MMA','BJJ']},
 {key:'ind10b',name:'Индивидуальные Бокс/Кикбоксинг · 10 сеансов',price:12000,sessions:10,kind:'ind',disc:['Бокс','Кикбоксинг']},
 {key:'ind8',name:'Индивидуальные · 8 сеансов',price:10000,sessions:8,kind:'ind',disc:['Бокс','Кикбоксинг']},
 {key:'free',name:'Безлимит · все дисциплины, без оплаты',price:0,sessions:null,kind:'group',disc:['MMA','BJJ','Бокс','Кикбоксинг','Капоэйра']},
 {key:'staff',name:'Сотрудник / тренер · без оплаты',price:0,sessions:null,kind:'staff',disc:[]}];
const DISCS=['MMA','Дети · MMA','BJJ','Бокс','Кикбоксинг','Капоэйра'];
/* несколько дисциплин у бойца: discs — список, disc — строка «MMA, BJJ» для показа и совместимости */
const discsOf=m=>Array.isArray(m&&m.discs)&&m.discs.length?m.discs:String(m&&m.disc||'').split(/\s*[,+]\s*/).filter(d=>d&&d!=='—');
const discPick=(id,m,free)=>{const cur=discsOf(m),all=[...new Set([...DISCS,...cur])],ro=!free&&!canAdm();
  return`<div class="chips dpick" id="${id}" role="group" aria-label="Дисциплины">${all.map(d=>`<label class="chip" style="display:inline-flex;gap:.3rem;align-items:center${ro?';opacity:.65':''}"><input type="checkbox" value="${esc(d)}" ${cur.includes(d)?'checked':''} ${ro?'disabled':''}> ${esc(d)}</label>`).join('')}</div><small style="color:var(--muted);font-size:.72rem">${ro?'Дисциплины меняет администратор клуба':'Можно выбрать несколько · по ним боец попадает в группы расписания'}</small>`};
const discGet=(id,host)=>[...$('#'+id,host).querySelectorAll('input:checked')].map(i=>i.value);
const discSet=(id,host,list)=>$('#'+id,host).querySelectorAll('input').forEach(i=>i.checked=list.includes(i.value));
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const addMonth=s=>{const d=new Date(s+'T12:00:00');const day=d.getDate();d.setMonth(d.getMonth()+1);if(d.getDate()!==day)d.setDate(0);return iso(d)};
const fmtD=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'—';
const daysLeft=s=>s?Math.round((new Date(s+'T12:00:00')-new Date(today()+'T12:00:00'))/864e5):null;
const lira=n=>(n==null?'—':Math.round(n).toLocaleString('ru-RU')+' ₺');
// «Безлимит для бойца» есть всегда; тариф staff — только для сотрудников (боец с ним выпадает из групп)
const tariffs=()=>{const L=(S.tariffs||DEF_TARIFFS).map(t=>t.key==='staff'&&/^Безлимит/.test(t.name)?{...t,name:'Сотрудник / тренер · без оплаты'}:t);if(!L.some(t=>t.key==='free'))L.splice(Math.max(0,L.findIndex(t=>t.key==='staff')),0,DEF_TARIFFS.find(t=>t.key==='free'));return L};
const tf=k=>tariffs().find(t=>t.key===k);
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const phoneDigits=p=>String(p||'').replace(/\D/g,'').replace(/^0/,'');
const phoneFmt=p=>{const d=phoneDigits(p);return d.length===10?`0 ${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6,8)} ${d.slice(8)}`:(p||'—')};

function status(m){
  if(m.kind==='staff')return{k:'staff',t:'Безлимит',c:'info'};
  if(frozenNow(m))return{k:'frozen',t:'Заморожен до '+fmtD(m.freeze.end),c:'info'};
  const d=daysLeft(m.end);
  if(d==null&&m.plan==='free')return{k:'ok',t:'Безлимит',c:'ok'};
  if(d==null)return{k:'none',t:'Нет абонемента',c:'bad'};
  if(d<0)return{k:'exp',t:'Истёк',c:'bad'};
  if(m.left!=null&&m.left<=0)return{k:'exp',t:'Занятия кончились',c:'bad'};
  if(d<=7||(m.left!=null&&m.left<=2))return{k:'soon',t:d<=7?`${d} дн.`:`ост. ${m.left}`,c:'warn'};
  return{k:'ok',t:'Активен',c:'ok'};
}
const todayIds=()=>new Set((S.visits[today()]||{}).ids||[]);

const FLB={name:'ФИО',last:'Фамилия',first:'Имя',email:'E-mail',phone:'Телефон',dob:'Дата рождения',plan:'Абонемент',start:'Начало',end:'Окончание',left:'Осталось занятий',disc:'Направление',parent:'Родитель',emergency:'Экстренный контакт',consentData:'Согласие на данные',photoConsent:'Согласие на фото',consentPublic:'Показ на экранах',consentMsg:'Сообщения',contractAt:'Договор',note:'Заметка',price:'Цена',kind:'Тип'};
/* ===== рендер ===== */
/* фоновые обновления (синхронизация, анкеты) не перерисовывают форму, которую сейчас заполняют */
const DIRTY={view:false,ov:false};
const markDirty=e=>{const t=e.target;if(!t||!t.closest||t.type==='search')return;if(t.closest('#ovHost'))DIRTY.ov=true;else if(t.closest('#view'))DIRTY.view=true};document.addEventListener('input',markDirty,true);document.addEventListener('change',markDirty,true);document.addEventListener('submit',e=>{const t=e.target;if(t&&t.closest){if(t.closest('#ovHost'))setTimeout(()=>DIRTY.ov=false,0);else if(t.closest('#view'))setTimeout(()=>DIRTY.view=false,0)}},true);
const busy=sel=>{const h=$(sel),a=document.activeElement;return!!(h&&a&&h.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=='search')};
const ovForm=()=>S.open?S.open==='new'||(!!S.drMode&&S.drMode!=='view'):false;
function renderBg(){const skipV=DIRTY.view||busy('#view'),skipO=DIRTY.ov||busy('#ovHost')||ovForm();
  if(!skipV)return render({keepOv:skipO,bg:true});
  try{updBell()}catch(e){}
  if(!skipO){const d=$('#ovHost .dr'),st=d?d.scrollTop:0;if(S.open)renderDrawer();else if(S.ov)renderOv();const d2=$('#ovHost .dr');if(d2)d2.scrollTop=st}}
function render(o){
  if(!o||!o.keepOv)DIRTY.ov=false;DIRTY.view=false;
  try{updBell()}catch(e){}
  document.body.classList.toggle('ro',!S.canWrite);
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  const v=$('#view');const sy=scrollY;
  v.innerHTML=({today:vToday,members:vMembers,leads:vLeads,cash:vCash,events:vEvents,sched:vSched,pv:vPv,rep:vReports,plans:vSettings})[S.tab]();
  bindView(v);if(S.tab==='sched')bindSched(v);if(S.tab==='pv')bindPv(v);if(S.tab==='leads')fillWho(v);scrollTo(0,sy);
  if(o&&o.keepOv)return;
  const d=$('#ovHost .dr'),st=d?d.scrollTop:0;
  if(S.open)renderDrawer();else if(S.ov)renderOv();
  const d2=$('#ovHost .dr');if(d2&&o&&o.bg)d2.scrollTop=st;
}
function loadingOrEmpty(){
  if(!S.ready.m)return`<div class="card empty">Загружаю базу клуба…</div>`;
  if(!S.members.length)return`<div class="card empty">В базе пока никого нет. Бойцы Mowgli появятся здесь после переноса из Maksisoft или после добавления через «+ Новый боец».</div>`;
  return'';
}
function vToday(){
  const le=loadingOrEmpty();
  const M=S.members,act=M.filter(m=>m.kind!=='staff'),st=act.map(m=>({m,s:status(m)})),
    soon=st.filter(x=>x.s.k==='soon'),exp=st.filter(x=>x.s.k==='exp'||x.s.k==='none'),
    ids=todayIds(),mk=today().slice(0,7),
    rev=S.payments.filter(p=>String(p.date).startsWith(mk)).reduce((a,p)=>a+(+p.sum||0),0);
  const d=new Date(),dn=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const q=S.ciq.trim().toLocaleLowerCase('tr'),res=q?M.filter(m=>(m.name+' '+phoneDigits(m.phone)).toLocaleLowerCase('tr').includes(q)).slice(0,6):[];
  const need=[...exp,...soon].sort((a,b)=>String(a.m.end).localeCompare(String(b.m.end)));
  return`<div class="head"><div><h1>Сегодня</h1><p class="sub">${esc(dn)}</p></div>
    <button class="btn gold w-only adm-only" data-act="new">+ Новый боец</button></div>
  ${(()=>{const n=(S.leads||[]).filter(pitPending).length;return n?`<button class="card" data-pitgo="1" style="display:flex;align-items:center;justify-content:space-between;gap:.8rem;width:100%;text-align:left;cursor:pointer;border-color:var(--gold);font:inherit;color:inherit"><span><b>${n} ${n===1?'регистрация':n<5?'регистрации':'регистраций'} в My PIT ждут одобрения</b><small style="display:block;color:var(--muted);font-size:.8rem">Бойцы зарегистрировались сами. Подтвердите или привяжите к карточке.</small></span><span class="pill gold">Открыть</span></button>`:''})()}
  ${le||`<div class="kpis">
    <button class="kpi" data-goflt="active"><b>${act.length-exp.length}</b><span>активных абонементов</span></button>
    <button class="kpi ok" data-goflt="today"><b>${ids.size}</b><span>пришли сегодня</span></button>
    <button class="kpi warn" data-goflt="soon"><b>${soon.length}</b><span>скоро продление</span></button>
    <button class="kpi bad" data-goflt="exp"><b>${exp.length}</b><span>истекли, не продлены</span></button>
    <button class="kpi gold" data-gotab="cash"><b>${Math.round(rev/1000).toLocaleString('ru-RU')}k</b><span>₺ оплат за ${MONTHS[d.getMonth()]}</span></button>
  </div>
  <div class="grid2">
    <section class="card ci"><h2>Отметить посещение</h2>
      <input type="search" id="ciq" placeholder="Имя или последние цифры телефона" value="${esc(S.ciq)}" autocomplete="off">
      <div class="ci-res">${q?(res.map(m=>{const s=status(m),here=ids.has(m.id);return`<div class="ci-it"><div><b>${esc(m.name)}</b><small>${esc(tf(m.plan)?.name||m.pkg||'—')} · ${m.left==null?'безлимит':'осталось '+m.left}</small></div>
        ${here?'<span class="pill ok">✓ отмечен</span>':`<button class="btn sm gold w-only" data-visit="${m.id}" ${s.k==='exp'||s.k==='none'?'title="Абонемент истёк"':''}>ПРИШЁЛ</button>`}</div>`}).join('')||'<div class="note">Никого не найдено</div>'):'<div class="note">Начните вводить имя — отметка списывает одно занятие с абонемента.</div>'}</div>
      <h2 style="margin-top:.4rem">Пришли сегодня · ${ids.size}</h2>
      <div class="vis">${[...ids].map(id=>M.find(m=>m.id===id)).filter(Boolean).map(m=>`<span>${esc(m.name)}</span>`).join('')||'<span class="note" style="border:0;background:none;padding:0">Пока никто не отмечен</span>'}</div>
    </section>
    ${pendingFreezes().length?`<section class="card" style="grid-column:1/-1"><h2>Запросы на заморозку · ${pendingFreezes().length}</h2><div class="list">${pendingFreezes().map(r=>{const m=S.members.find(x=>x.id===r.mid);return m?`<button class="row" data-open="${m.id}" style="grid-template-columns:minmax(0,1fr) auto"><span class="nm">${esc(m.name)}<small>${esc(FZFROM[r.from]||'')} · с ${fmtD(r.start)} на ${r.days} дн. · ${esc(r.reason)}</small></span><span class="pill gold">ждёт решения</span></button>`:''}).join('')}</div></section>`:''}
    ${(()=>{const A=awayList();return A.length?`<section class="card"><h2>Давно не были · ${A.length} <span class="note" style="text-transform:none;letter-spacing:0">≥ ${SET().retDays} дн.</span></h2><div class="list">${A.slice(0,10).map(x=>`<button class="row" data-open="${x.m.id}" style="grid-template-columns:minmax(0,1fr) auto"><span class="nm">${esc(x.m.name)}<small>${x.ls?'последний раз '+fmtD(x.ls):'в PIT CRM ещё не отмечался'} · ${esc(tf(x.m.plan)?.name||'')}</small></span><span class="pill warn">${x.days} дн.</span></button>`).join('')}</div><p class="note" style="margin:.6rem 0 0">${SET().retAuto?'Автосообщение отправит приложение PIT, когда оно заработает.':'Позвоните или напишите. Автосообщение включается в «Настройках».'}</p></section>`:''})()}
    <section class="card"><h2>Нужно продлить · ${need.length}</h2>
      <div class="list">${need.slice(0,12).map(x=>rowMini(x.m,x.s)).join('')||'<div class="empty">Все абонементы в порядке</div>'}</div>
      ${need.length>12?`<button class="btn sm" data-goflt="soon" style="margin-top:.6rem">Показать всех · ${need.length}</button>`:''}
    </section>
  </div>`}`;
}
function rowMini(m,s){return`<button class="row" data-open="${m.id}" style="grid-template-columns:minmax(0,1fr) auto"><span class="nm">${esc(m.name)}<small>${esc(tf(m.plan)?.name||m.pkg||'—')} · до ${fmtD(m.end)}${m.left!=null?' · ост. '+m.left:''}</small></span><span class="pill ${s.c}">${esc(s.t)}</span></button>`}

const FLT=[['all','Все'],['active','Активные'],['today','Пришли сегодня'],['soon','Скоро продление'],['exp','Истекли'],['group','Группы'],['kids','Дети'],['ind','Индивидуальные'],['staff','Безлимит'],['debt','Не оплатили'],['nodoc','Без договора'],['nocons','Нет согласия'],['noem','Нет экстренного контакта'],['u18','U18'],['frozen','Заморожены']];
function fltFn(k){const ids=todayIds();return({all:()=>true,active:m=>m.kind!=='staff'&&!['exp','none'].includes(status(m).k),today:m=>ids.has(m.id),soon:m=>status(m).k==='soon',exp:m=>['exp','none'].includes(status(m).k),group:m=>m.kind==='group',kids:m=>m.kind==='kids',ind:m=>m.kind==='ind',staff:m=>m.kind==='staff',debt:m=>!!m.due,nodoc:m=>!m.contractAt,nocons:m=>m.consentData!=='yes',noem:m=>!(m.emergency&&m.emergency.phone),u18:m=>isMinor(m),frozen:m=>frozenNow(m)})[k]}
function vMembers(){
  const le=loadingOrEmpty(),q=S.q.trim().toLocaleLowerCase('tr'),
    L=S.members.filter(fltFn(S.flt)).filter(m=>!q||(m.name+' '+phoneDigits(m.phone)+' '+(m.disc||'')).toLocaleLowerCase('tr').includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'tr'));
  return`<div class="head"><div><h1>Бойцы · ${S.members.length}</h1><p class="sub">Клик по строке — карточка, продление, история посещений и оплат.</p></div>
    <div class="acts"><button class="btn" data-act="csv">Скачать CSV</button><button class="btn gold w-only adm-only" data-act="new">+ Новый боец</button></div></div>
  ${le||`<input type="search" id="mq" placeholder="Поиск: имя, телефон, дисциплина" value="${esc(S.q)}" autocomplete="off">
  <div class="chips">${FLT.map(([k,t])=>`<button class="chip" data-flt="${k}" aria-pressed="${S.flt===k}">${t}<i>${S.members.filter(fltFn(k)).length}</i></button>`).join('')}</div>
  <section class="card" style="padding:.6rem">
    <div class="lh"><span>Боец</span><span>Абонемент</span><span>До</span><span>Осталось</span><span>Статус</span><span></span></div>
    <div class="list">${L.map(m=>{const s=status(m),d=daysLeft(m.end);return`<div class="row" role="button" tabindex="0" data-open="${m.id}">
      <span class="nm">${esc(m.name)}<small>${esc(m.disc||'—')}${m.kind==='kids'?' · дети':''}${m.due?` · <b style="color:var(--bad)">💳 не оплачено${m.due.date?' · до '+fmtD(m.due.date):''}</b>`:''}</small></span>
      <span class="tf">${esc(tf(m.plan)?.name||m.pkg||'—')}</span>
      <span class="c3 num ${d!=null&&d<0?'':''}">${m.kind==='staff'?'—':fmtD(m.end)}</span>
      <span class="c4 num">${m.left==null?'∞':m.left}</span>

      <span class="act"><button class="btn sm w-only" data-visit="${m.id}" ${todayIds().has(m.id)?'disabled':''}>${todayIds().has(m.id)?'✓ сегодня':'Пришёл'}</button></span></div>`}).join('')||'<div class="empty">Никого не найдено</div>'}</div>
  </section>`}`;
}
function vPlans(){
  const cnt=k=>S.members.filter(m=>m.plan===k).length;
  return`<div class="head"><div><h1>Тарифы Mowgli</h1><p class="sub">Цены в лирах за месяц. Новая цена действует для следующих продлений, прошлые оплаты не меняются.</p></div></div>
  <section class="card"><div class="scroll"><table class="tbl"><thead><tr><th>Абонемент</th><th>Дисциплины</th><th class="r">Занятий</th><th class="r">Бойцов</th><th class="r">Цена, ₺</th></tr></thead><tbody>
  ${tariffs().map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc((t.disc||[]).join(', ')||'—')}</td><td class="r num">${t.sessions??'∞'}</td><td class="r num">${cnt(t.key)}</td>
    <td class="r">${S.canWrite&&t.key!=='staff'?`<input type="number" class="num" data-price="${t.key}" value="${t.price}" min="0" step="100" style="width:7rem;text-align:right" aria-label="Цена ${esc(t.name)}">`:`<span class="num">${t.price.toLocaleString('ru-RU')}</span>`}</td></tr>`).join('')}
  </tbody></table></div>

/* ===== перерасчёт по оставшимся дням (правило лояльности Mowgli) ===== */
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function credit(m){const price=+m.price||0;if(!price||!m.start||!m.end)return{price,total:0,rem:0,sum:0};
  const total=Math.max(1,daysBetween(m.start,m.end)),rem=Math.min(total,Math.max(0,daysLeft(m.end)));
  return{price,total,rem,sum:Math.round(price*rem/total)}}
function changeCalc(m,plan){const c=credit(m),t=tf(plan),P=t?.price||0,start=today();let pay=Math.max(0,P-c.sum),extra=0,end=addMonth(start);
  if(c.sum>P&&P>0){extra=Math.round((c.sum-P)/P*daysBetween(start,end));end=addDays(end,extra)}
  return{c,t,P,pay,extra,start,end}}
function changeHTML(m){const first=tariffs().find(t=>t.key!==m.plan&&t.key!=='staff')||tariffs()[0];
  return`<form class="card form" id="cf"><h2 class="full">Смена абонемента · перерасчёт</h2>
  <label class="f full">Новый абонемент<select id="c_plan">${planOptions(first.key)}</select></label>
  <div class="f" style="grid-column:1/-1"><span style="font-size:.74rem;font-weight:700;color:var(--muted)">Дисциплины</span>${discPick('c_disc',m)}</div>

  <div class="acts full"><button class="btn gold" type="submit">Перевести на новый абонемент</button><button class="btn" type="button" data-dr="view">Отмена</button></div></form>`}
function changeCalcHTML(m,plan){const x=changeCalc(m,plan),c=x.c;
  return`<dl class="kv">
   <dt>Текущий</dt><dd>${esc(tf(m.plan)?.name||m.pkg||'—')} · <span class="num">${lira(c.price)}</span> за <span class="num">${c.total}</span> дн.</dd>
   <dt>Осталось</dt><dd><span class="num">${c.rem}</span> из ${c.total} дней (до ${fmtD(m.end)})</dd>

   <dt>${x.pay>0?'Доплата':'Итог'}</dt><dd>${x.pay>0?`<b class="num">${lira(x.pay)}</b>`:x.extra?'доплаты нет, остаток продлевает срок':'доплаты нет'}</dd></dl>`}

let DB=null;
function toast(t,ms){let e=$('#toastEl');if(!e){e=document.createElement('div');e.id='toastEl';e.className='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms||2600)}
async function write(fn,ok){if(!DB){toast('База недоступна в этом окне');return false}
  try{await fn();if(ok){toast(ok);audit(ok)}return true}catch(e){if(e&&e.code==='invalid_argument'&&!S.canWriteChecked){S.canWrite=false;render();toast('У вас доступ только для просмотра')}else toast('Не сохранилось: '+(e&&e.message||'ошибка базы'));return false}}
async function markVisit(id){const m=S.members.find(x=>x.id===id);if(!m)return;const d=today(),cur=(S.visits[d]||{}).ids||[];if(cur.includes(id))return;
  const okV=await write(async()=>{if(window.PIT&&PIT.push){await PIT.push('visits',d,'ids',id,{date:d,ids:[],t:{}},2000);await DB.doc('visits/'+d).update({t:{...((S.visits[d]||{}).t||{}),[id]:nowHM()}})}else await DB.doc('visits/'+d).set({date:d,ids:[...cur,id],t:{...((S.visits[d]||{}).t||{}),[id]:nowHM()}})});if(!okV)return;
  audit('Посещение: '+m.name,{mid:id});
  if(m.left!=null&&m.left>0)await write(()=>DB.doc('members/'+id).update({left:m.left-1}));
  if(frozenNow(m))toast(m.name+': абонемент заморожен — проверьте');
  const s=status(m);toast(`${m.name}: отмечен${m.left!=null?` · осталось ${Math.max(0,m.left-1)}`:''}${s.k==='exp'||s.k==='none'?' · абонемент истёк':''}`)}
function newId(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function csvSave(name,rows){const csv='﻿'+rows.map(r=>r.map(x=>{x=String(x??'');return/[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(';')).join('\r\n');
  claude.use('downloads').then(dl=>{if(!dl){toast('Скачивание недоступно в этом окне');return}return dl.save({filename:name,data:csv}).then(()=>toast('Файл сохранён'),e=>{if(e&&e.code!=='declined')toast('Не удалось сохранить файл')})})}

 'Функционал':GSVG(`<path d="M45,45 q-3,-23 15,-23 q18,0 15,23" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/><circle cx="60" cy="68" r="25" fill="url(#b)" stroke="url(#g)" stroke-width="4"/><path d="M47,60 q13,-9 26,0" fill="none" stroke="#e8c35a55" stroke-width="3" stroke-linecap="round"/>`)};
const GURI={};function gLogo(name){if(GURI[name])return GURI[name];

const canAdm=()=>['owner','admin'].includes((window.PIT_ME||{}).role);
// состав группы = активные бойцы с этой дисциплиной в карточке (единственный источник — карточка бойца)
const isKid=m=>m.kind==='kids'||(m.dob?ageOf(m.dob)<18:false)||!!(m.parent&&(m.parent.name||m.parent.mid));
const inGroup=(m,c)=>{if(!m||m.kind==='staff')return false;const cd=String(c.disc||''),kids=isKid(m);if(cd==='Все группы')return true;
  const L=discsOf(m),k=/^Дети/i.test(cd),base=cd.replace(/^Дети\s*·\s*/i,'');return k?L.includes(cd)||kids&&L.includes(base):!kids&&L.includes(cd)};
const gIds=c=>S.members.filter(m=>inGroup(m,c)&&!['exp','none'].includes(status(m).k)).sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(m=>m.id);
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const avc=id=>{let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return`hsl(${h%360} 45% 42%)`};
const gAv=ids=>`<span class="gav">${ids.slice(0,6).map(id=>{const m=S.members.find(x=>x.id===id);return`<i style="background:${avc(id)}" title="${esc(m?.name)}">${esc(ini(m?.name))}</i>`}).join('')}${ids.length>6?`<u>+${ids.length-6}</u>`:''}</span>`;
function plural(n,a,b,c){n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k>1&&k<5?b:k===1?a:c}

const dowOf=d=>{const x=new Date(d+'T12:00:00').getDay();return x||7};


/* ===== Формат заявки: пробные, все абонементы и все услуги клуба ===== */
function fmtList(){const s=SET();return[
  ['Пробное · группа — '+lira(s.trialGroup),[['group','Пробное · группа (направление ниже)'],...DISCS.map(d=>['tg:'+d,'Пробное · '+d+' · группа'])]],
  ['Пробное · индивидуальное — '+lira(s.trialInd),[['ind','Пробное · индивидуальное'],...DISCS.filter(d=>!/^Дети/.test(d)).map(d=>['ti:'+d,'Пробное · '+d+' · индивидуальное'])]],
  ['Абонементы',tariffs().filter(t=>t.kind!=='staff').map(t=>['t:'+t.key,t.name+' — '+lira(t.price)])],
  ['Услуги',services().filter(v=>!/^Пробное/i.test(v[0])).map(v=>['s:'+v[0],v[0]+(+v[1]?' — '+lira(+v[1]):'')])]]}
const fmtOpts=x=>{const cur=x.fmt||(x.kind==='ind'?'ind':'group');return fmtList().map(([g,L])=>`<optgroup label="${esc(g)}">${L.map(([k,t])=>`<option value="${esc(k)}" ${k===cur?'selected':''}>${esc(t)}</option>`).join('')}</optgroup>`).join('')};
function fmtVal(v){let kind='group',name='';
  if(v==='ind'){kind='ind';name='Пробное · индивидуальное'}else if(v==='group')name='Пробное · группа';
  else if(v.startsWith('tg:')||v.startsWith('ti:')){kind=v[1]==='i'?'ind':'group';name='Пробное · '+v.slice(3)+(kind==='ind'?' · индивидуальное':' · группа');return{kind,fmt:v,fmtName:name,_d:v.slice(3)}}
  else if(v.startsWith('t:')){const t=tf(v.slice(2));kind=t&&t.kind==='ind'?'ind':'group';name=t?t.name:v}
  else if(v.startsWith('s:')){name=v.slice(2);kind=/персональн|индивид/i.test(name)?'ind':'group'}
  return{kind,fmt:v,fmtName:name}}
const fmtTxt=x=>x.fmtName||(x.kind==='ind'?'индивидуальное':'группа');
/* ===== Продажа абонемента прямо из заявки: боец + абонемент + оплата/долг + группа ===== */
const leadPlan=x=>x.fmt&&x.fmt.startsWith('t:')&&tf(x.fmt.slice(2))?x.fmt.slice(2):x.kind==='ind'?(discsOf(x).some(d=>['Бокс','Кикбоксинг'].includes(d))?'ind10b':'ind10m'):((/дет|\b([4-9]|1[0-7])\s*лет/i.test(x.age||'')&&discsOf(x).includes('MMA'))||discsOf(x).includes('Дети · MMA')?'kids12':'grp12');
const clsLbl=c=>`${(c.dow||[]).map(d=>SDAYS[d-1]).join('/')} ${c.time} · ${c.disc}`;
function sellHTML(x){const T=tariffs().filter(t=>t.kind!=='staff'),pl=leadPlan(x),cl=SCH().classes.slice().sort((a,b)=>String(a.time).localeCompare(String(b.time))),want=discsOf(x),

    <div class="f" style="grid-column:1/-1"><span style="font-size:.74rem;font-weight:700;color:var(--muted)">Дисциплины</span>${discPick('sl_d',{discs:[...new Set([...want,...(bc?[bc.disc]:[])])]},true)}</div>
    <label class="f">Начало<input type="date" id="sl_s" value="${today()}"></label>

function bindSell(host,x,apv){const f=$('#sellf',host);if(!f)return;

  sg.addEventListener('change',()=>{const c=SCH().classes.find(z=>z.id===sg.value);if(c){const cur=discGet('sl_d',host);discSet('sl_d',host,[...new Set([...cur,c.disc])])}});

  f.addEventListener('submit',async e=>{e.preventDefault();if(!canAdm()){toast('Продажа — администратор клуба');return}
    const plan=sp.value,t=tf(plan),start=ss.value,end=$('#sl_e',host).value,sum=Math.max(0,+$('#sl_sum',host).value||0),method=sm.value,dl=discGet('sl_d',host);

    const r=x.reg||{},w=String(x.name||'').trim().split(/\s+/),last=r.last||(w.length>1?w.pop():''),first=r.first||w.join(' ')||x.name,id=newId();
    const doc={name:[first,last].filter(Boolean).join(' '),first,last,phone:x.phone||r.phone||'',email:r.email||x.email||'',dob:r.dob||'',parent:r.parent||null,disc:dl.join(', '),discs:dl,plan,kind:t?.kind||'group',price:t?.price??null,start,end,left:t?.sessions??null,note:x.note||'',src:'pit',lead:x.id,createdAt:new Date().toISOString(),
      ...(method==='debt'&&sum>0?{due:{sum,date:$('#sl_due',host).value||addDays(today(),3),since:today(),plan,what:'Абонемент',note:''}}:{})};
    if(!await write(()=>DB.doc('members/'+id).set(doc)))return;
    if(method!=='debt'&&sum>0)await write(()=>DB.collection('payments').doc().set({kind:'sub',mid:id,name:doc.name,sum,date:today(),ts:new Date().toISOString(),plan,method,what:'Абонемент',src:'pit'}));
    const c=SCH().classes.find(z=>z.id===sg.value);

    ovClose();S.tab='members';render();S.open=id;S.drMode='view';renderDrawer()})}
function trialOpts(x,d){const L=d?SCH().classes.filter(c=>(c.dow||[]).includes(dowOf(d))).sort((a,b)=>String(a.time).localeCompare(String(b.time))):[];

function stackBars(rows,keys,cols){const mx=Math.max(1,...rows.map(r=>keys.reduce((a,k)=>a+(r.v[k]||0),0))),W=560,H=200,pl=44,pb=24,bw=Math.min(56,(W-pl)/rows.length*.6),step=(W-pl)/rows.length;
  const tick=[0,.5,1].map(f=>Math.round(mx*f));
  return`<svg viewBox="0 0 ${W} ${H+pb}" role="img" aria-label="Доходы по месяцам" style="width:100%;height:auto;max-width:100%">
   ${tick.map(t=>{const y=H-t/mx*(H-10);return`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${t>=1000?Math.round(t/1000)+'k':t}</text>`}).join('')}
   ${rows.map((r,i)=>{let y=H;const x=pl+i*step+(step-bw)/2;const segs=keys.map((k,j)=>{const h=(r.v[k]||0)/mx*(H-10);y-=h;return h>0?`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${cols[j]}"><title>${KINDS[k]||k}: ${lira(r.v[k])}</title></rect>`:''}).join('');
     return segs+`<text x="${x+bw/2}" y="${H+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${r.l}</text>`}).join('')}</svg>`}

async function loadPv(){try{const r=await fetch('/api/review',{cache:'no-store',credentials:'same-origin'});if(!r.ok)return;S.pv=await r.json();const n=S.pv.counts.todo,b=$('#pvN');if(b){b.hidden=!n;b.textContent=n}if(S.tab==='pv'||S.open)renderBg();else updBell()}catch(e){}}
setTimeout(loadPv,800);setInterval(()=>{if(!document.hidden)loadPv()},30000);
const PVF={last:'Фамилия',first:'Имя',dob:'Дата рождения',phone:'Телефон',disc:'Направление',kind:'Формат',note:'Комментарий',weight:'Вес / категория',stance:'Стойка',belt:'Пояс / ранг',city:'Город',photo:'Фото',parent:'Родитель'};
const PVST={orthodox:'Ортодокс',southpaw:'Левша',switch:'Свитч'},PVLV={club:'клубный',city:'городской',regional:'региональный',national:'национальный',international:'международный',pro:'профессиональный'};
const pvVal=(k,v)=>{if(v==null||v==='')return'<span class="muted">—</span>';if(k==='photo')return `<img src="/api/my/photo/${esc(v)}" alt="" style="width:3.2rem;height:3.2rem;object-fit:cover;border-radius:50%">`;if(k==='parent')return esc((v.name||'')+' '+(v.phone||''));if(k==='dob')return fmtD(v);if(k==='stance')return esc(PVST[v]||v);if(k==='kind')return v==='ind'?'индивидуально':'группа';return esc(v)};
function pvItem(i){const d=i.data,lk=d.link||d.url;let h='';
  if(i.kind==='comp')h=`<b>${esc(d.name)}</b><small>${esc(d.date)}${d.place?' · '+esc(d.place):''}${d.org?' · '+esc(d.org):''} · ${esc(PVLV[d.level]||'')}${d.disc?' · '+esc(d.disc):''}${d.weight?' · '+esc(d.weight):''}</small><span>${d.rtype==='bout'?({W:'Победа',L:'Поражение',D:'Ничья'})[d.res]+(d.method?' · '+esc(d.method):'')+(d.opp?' · против '+esc(d.opp):''):d.pos==='part'?'Участие':['','🥇 1','🥈 2','🥉 3'][+d.pos]+' место'}</span>${d.desc?`<em>${esc(d.desc)}</em>`:''}`;
  if(i.kind==='title')h=`<b>🏆 ${esc(d.name)}</b><small>${[d.year,d.org].filter(Boolean).map(esc).join(' · ')}</small>`;
  if(i.kind==='club')h=`<b>Прошлый клуб: ${esc(d.name)}</b><small>${esc(d.city||'')} · ${esc(d.from||'?')} — ${esc(d.to||'н.в.')}</small>`;
  if(i.kind==='link')h=`<b>🔗 Профиль: ${esc(d.site||'')}</b><small>Импорт: откройте ссылку и подтвердите соревнования бойца, которые там указаны</small>`;
  return `<div class="pv-it"><div class="pv-ih">${h}${lk?`<a href="${esc(lk)}" target="_blank" rel="noopener nofollow">Открыть ссылку ↗</a>`:''}</div><div class="acts w-only"><button class="btn sm gold" data-pvi="${esc(i.id)}" data-a="ok">✓ Подтвердить</button><button class="btn sm danger" data-pvi="${esc(i.id)}" data-a="no">Отклонить</button></div></div>`}
function vPv(){const P=S.pv;if(!P)return `<div class="head"><div><h1>Анкеты бойцов</h1></div></div><div class="card empty">Загружаю анкеты…</div>`;
  const regs=(S.leads||[]).filter(pitPending),mn=id=>S.members.find(m=>m.id===id);
  return `<div class="head"><div><h1>Анкеты бойцов</h1><p class="sub">Боец сам правит анкету в My PIT — подтверждает только клуб. После подтверждения у бойца ✓ Verified и логотип клуба, данные переносятся в карточку.</p></div>
    <button class="btn w-only" data-pvinvall>Пригласить всех с e-mail</button></div>
  <div class="kpis"><div class="kpi warn"><b>${P.counts.todo}</b><span>анкет на проверке</span></div><div class="kpi"><b>${P.counts.items}</b><span>достижений ждут</span></div><div class="kpi ok"><b>${P.counts.verified}</b><span>✓ Verified</span></div><div class="kpi"><b>${P.all.length}</b><span>бойцов в My PIT</span></div></div>
  ${regs.length?`<button class="card" data-pitgo="1" style="display:flex;align-items:center;justify-content:space-between;gap:.8rem;width:100%;text-align:left;cursor:pointer;border-color:var(--gold);font:inherit;color:inherit"><span><b>${regs.length} новых регистраций ждут одобрения</b><small style="display:block;color:var(--muted);font-size:.8rem">Одобрение в «Заявках»: подтвердите и привяжите к карточке бойца.</small></span><span class="pill gold">Открыть</span></button>`:''}
  ${P.todo.map(x=>{const m=x.mid&&mn(x.mid),pk=x.pending?Object.keys(x.pending):[],pi=x.items.filter(i=>i.status==='pending');
    return `<section class="card pv" data-pve="${esc(x.email)}"><div class="pv-h">${x.photo?`<img src="${esc(x.photo)}" alt="">`:`<span class="pv-a">${esc((x.profile.first||'?')[0])}</span>`}<div><b>${esc(x.name)}</b><small>${esc(x.email)}${m?' · карточка: '+esc(m.name):' · <span class="bad">не привязан к карточке</span>'}</small></div>${x.verified?'<span class="pill ok">✓ Verified</span>':'<span class="pill warn">не подтверждён</span>'}</div>
      ${pk.length?`<h3>Изменения анкеты</h3><table class="pv-t"><thead><tr><th>Поле</th><th>Было</th><th>Стало</th></tr></thead><tbody>${pk.map(k=>`<tr><td>${esc(PVF[k]||k)}</td><td>${pvVal(k,x.profile[k])}</td><td><b>${pvVal(k,x.pending[k])}</b></td></tr>`).join('')}</tbody></table>
        <div class="acts w-only"><button class="btn sm gold" data-pvp="ok">✓ Подтвердить изменения</button><button class="btn sm danger" data-pvp="no">Отклонить изменения</button></div>`:''}
      ${pi.length?`<h3>Достижения на проверке · ${pi.length}</h3>${pi.map(pvItem).join('')}`:''}
      <div class="pv-f w-only"><input type="text" class="pv-note" maxlength="300" placeholder="Комментарий бойцу при отклонении (необязательно)">${pk.length||pi.length>1?`<button class="btn gold" data-pvall>✓ Подтвердить всё</button>`:''}</div></section>`}).join('')||'<div class="card empty">Нет анкет на проверке. Когда боец изменит анкету или добавит медали и соревнования, они появятся здесь.</div>'}
  <section class="card"><h2>Бойцы в My PIT · ${P.all.length}</h2><div class="list">${P.all.map(x=>{const m=x.mid&&mn(x.mid),ok=x.items.filter(i=>i.status==='ok');
    return `<div class="row" style="grid-template-columns:minmax(0,1fr) auto;cursor:default"><span class="nm">${esc(x.name||x.email)}<small>${esc(x.email)}${m?' · '+esc(m.name):''} · медалей ${ok.filter(i=>i.kind==='comp'&&['1','2','3'].includes(i.data.pos)&&i.data.rtype!=='bout').length} · соревнований ${ok.filter(i=>i.kind==='comp').length}${x.invited&&!x.profile.consentData?' · приглашён, ещё не вошёл':''}</small></span>${x.verified?'<span class="pill ok">✓ Verified</span>':'<span class="pill warn">ждёт</span>'}</div>`}).join('')||'<div class="empty">Пока никого. Пригласите бойцов или покажите QR на ресепшене: app.pitrating.com/my</div>'}</div></section>`}
function bindPv(v){
  const post=async(u,b,msg)=>{try{const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw 0;if(msg){toast(msg);audit(msg)}await loadPv();return j}catch(e){toast('Не сохранилось');return null}};
  v.querySelectorAll('[data-pvi]').forEach(b=>b.addEventListener('click',()=>{const c=b.closest('[data-pve]');post('/api/review',{item:b.dataset.pvi,act:b.dataset.a,note:c.querySelector('.pv-note')?.value||''},(b.dataset.a==='ok'?'Достижение подтверждено: ':'Достижение отклонено: ')+c.querySelector('b').textContent)}));
  v.querySelectorAll('[data-pvp]').forEach(b=>b.addEventListener('click',()=>{const c=b.closest('[data-pve]');post('/api/review',{email:c.dataset.pve,act:b.dataset.pvp==='ok'?'profile_ok':'profile_no',note:c.querySelector('.pv-note')?.value||''},(b.dataset.pvp==='ok'?'Анкета подтверждена: ':'Изменения анкеты отклонены: ')+c.querySelector('b').textContent)}));
  v.querySelectorAll('[data-pvall]').forEach(b=>b.addEventListener('click',()=>{const c=b.closest('[data-pve]');post('/api/review',{email:c.dataset.pve,act:'all_ok'},'Всё подтверждено: '+c.querySelector('b').textContent)}));
  const ia=v.querySelector('[data-pvinvall]');if(ia)ia.addEventListener('click',async()=>{if(!ia.dataset.sure){ia.dataset.sure=1;ia.textContent='Отправить приглашения?';return}ia.disabled=true;const j=await post('/api/review/invite',{all:true});if(j)toast(`Приглашений отправлено: ${j.sent}${j.noEmail?` · без e-mail: ${j.noEmail}`:''}`);ia.disabled=false;ia.textContent='Пригласить всех с e-mail';delete ia.dataset.sure});
}
function pitBlock(m){if(m.kind==='staff'||!S.pv)return'';const x=S.pv.all.find(f=>f.mid===m.id);
  if(x)return `<section class="card"><h2>My PIT</h2><div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">${x.verified?'<span class="pill ok">✓ Verified</span>':'<span class="pill warn">не подтверждён</span>'}<span class="muted small">${esc(x.email)}${x.invited&&!x.profile.consentData?' · приглашён, ещё не вошёл':''}</span><span style="flex:1"></span><button class="btn sm" data-pitopen="1">Анкета бойца${x.pending||x.pendingItems?` · на проверке ${(x.pending?1:0)+x.pendingItems}`:''}</button></div></section>`;
  const em=String(m.email||'').trim();
  return `<section class="card"><h2>My PIT</h2><div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap"><span class="muted small">${em?'Боец ещё не в My PIT.':'Нет e-mail — добавьте его в карточку, чтобы пригласить. Или боец сам зарегистрируется по QR.'}</span><span style="flex:1"></span>${em?`<button class="btn sm gold w-only" data-pitinv="${esc(m.id)}">Пригласить в My PIT</button>`:''}</div></section>`}
document.addEventListener('click',async e=>{const op=e.target.closest('[data-pitopen]');if(op){S.open=null;$('#ovHost').innerHTML='';S.tab='pv';render();scrollTo(0,0);return}
  const iv=e.target.closest('[data-pitinv]');if(iv){iv.disabled=true;try{const r=await fetch('/api/review/invite',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({mid:iv.dataset.pitinv})});const j=await r.json();toast(j.sent?'Приглашение отправлено':'Не отправлено: проверьте e-mail');if(j.sent)audit('Приглашение в My PIT');await loadPv()}catch(x){toast('Не отправлено')}iv.disabled=false}});

   ${D.note?`<p class="note" style="margin:0 0 .5rem">${esc(D.note)}</p>`:''}
   <form class="w-only" id="duepay" style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end">

    <label class="f fin-only" style="min-width:7rem">Сумма, ₺<input type="number" id="dp_s" min="0" step="50" value="${esc(String(D.sum||''))}"></label>
    <button class="btn gold fin-only" type="submit">✓ Оплатил</button>
    <label class="f" style="min-width:9rem">Новая дата<input type="date" id="dp_d" value="${esc(D.date||addDays(td,3))}"></label>
    <button class="btn" type="button" data-duemove>Перенести</button>
    <button class="btn sm danger adm-only" type="button" data-duedel>Снять отметку</button></form></section>`}
function bindDue(host,m){if(!m)return;
  const nf=$('#duenew',host);if(nf)nf.addEventListener('submit',async e=>{e.preventDefault();const sum=Math.max(0,+$('#du_s',host).value||0),date=$('#du_d',host).value;if(!date){toast('Укажите дату оплаты');return}
    const ok=await write(()=>DB.doc('members/'+m.id).update({due:{sum,date,since:today(),plan:m.plan||null,what:'Абонемент',note:$('#du_n',host).value.trim()}}),`Не оплачено: ${m.name} · обещал до ${fmtD(date)}`);if(ok)renderDrawer()});
  const pf=$('#duepay',host);if(!pf)return;
  pf.addEventListener('submit',async e=>{e.preventDefault();const D=m.due||{},sum=Math.max(0,+$('#dp_s',host).value||0),method=$('#dp_m',host).value;
    let ok=true;if(sum>0)ok=await write(()=>DB.collection('payments').doc().set({kind:'sub',mid:m.id,name:m.name,sum,date:today(),ts:new Date().toISOString(),plan:D.plan||m.plan||null,method,what:(D.what||'Абонемент')+' · долг от '+fmtD(D.since||today()),src:'pit'}));
    if(ok&&await write(()=>DB.doc('members/'+m.id).update({due:null}),`Оплачено: ${m.name} · ${lira(sum)}`))renderDrawer()});
  const mv=$('[data-duemove]',host);if(mv)mv.addEventListener('click',async()=>{const d=$('#dp_d',host).value;if(!d){toast('Укажите дату');return}
    if(await write(()=>DB.doc('members/'+m.id).update({due:{...m.due,date:d}}),`${m.name}: оплата перенесена на ${fmtD(d)}`))renderDrawer()});
  const dl=$('[data-duedel]',host);if(dl)dl.addEventListener('click',async()=>{if(!dl.dataset.sure){dl.dataset.sure=1;dl.textContent='Точно снять?';return}
    if(await write(()=>DB.doc('members/'+m.id).update({due:null}),`Снята отметка «не оплачено»: ${m.name}`))renderDrawer()})}

/* ===== Поиск похожего бойца для регистрации My PIT: имя, фамилия, дата рождения/возраст, телефон, почта, родитель ===== */
const MATCH_MIN=3;
const TRL={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya',ş:'s',ç:'c',ğ:'g',ı:'i',ö:'o',ü:'u',â:'a',î:'i',û:'u'};
const nrm=t=>String(t||'').toLocaleLowerCase('tr').replace(/i̇/g,'i').split('').map(c=>TRL[c]??c).join('').replace(/[^a-z0-9]/g,'');
const nameToks=t=>String(t||'').split(/[\s\-]+/).map(nrm).filter(w=>w.length>1);
const ph10=t=>{const d=String(t||'').replace(/\D/g,'');return d.length>=7?d.slice(-10):''};
function regOf(x){const P=S.pv&&S.pv.all&&x.email?S.pv.all.find(f=>f.email===String(x.email).toLowerCase()):null,pr=(P&&P.profile)||{},r=x.reg||{};
  const w=String(x.name||'').trim().split(/\s+/);
  return{first:r.first||pr.first||'',last:r.last||pr.last||'',toks:nameToks([r.first||pr.first,r.last||pr.last].filter(Boolean).join(' ')||x.name),dob:r.dob||pr.dob||'',age:x.age?+x.age:null,
    phone:r.phone||pr.phone||x.phone||'',email:String(r.email||x.email||'').toLowerCase(),parent:r.parent||pr.parent||null,w}}
function matchScore(x,m,R){R=R||regOf(x);const why=[];
  const mt=nameToks(m.first&&m.last?m.first+' '+m.last:m.name),fn=nameToks(m.first||nameParts(m).first),ln=nameToks(m.last||nameParts(m).last);
  const has=a=>a.length&&a.every(t=>R.toks.includes(t));
  if(has(fn))why.push('имя');if(has(ln))why.push('фамилия');
  if(!fn.length&&!ln.length&&mt.some(t=>R.toks.includes(t)))why.push('имя');
  if(R.dob&&m.dob&&R.dob===m.dob)why.push('дата рождения');
  else if(R.age&&m.dob&&ageOf(m.dob)===R.age)why.push('возраст');
  const p=ph10(R.phone);if(p&&ph10(m.phone)===p)why.push('телефон');
  else if(p&&m.parent&&ph10(m.parent.phone)===p)why.push('телефон родителя');
  if(R.parent&&R.parent.phone&&m.parent&&ph10(m.parent.phone)===ph10(R.parent.phone)&&!why.includes('телефон родителя'))why.push('телефон родителя');
  if(R.parent&&R.parent.name&&m.parent&&m.parent.name&&nameToks(R.parent.name).some(t=>nameToks(m.parent.name).includes(t)))why.push('родитель');
  if(R.email&&m.email&&String(m.email).toLowerCase()===R.email)why.push('почта');
  return{n:why.length,why}}
function bestMatch(x){const R=regOf(x);let best=null;for(const m of S.members){if(m.kind==='staff')continue;const r=matchScore(x,m,R);if(r.n&&(!best||r.n>best.n))best={...r,m}}return best&&best.n>=MATCH_MIN?{...best,R}:null}
function mergePlan(x,m,R){R=R||regOf(x);const f=[],put=(k,lbl,v)=>{if(v&&!m[k])f.push([k,lbl,v])};
  put('dob','Дата рождения',R.dob);put('phone','Телефон',R.phone);put('email','E-mail',R.email);
  if(R.parent&&R.parent.name&&!(m.parent&&m.parent.name))f.push(['parent','Родитель',R.parent]);return f}
function notes(){const out=[],td=today(),tm=addDays(td,1),M=S.members.filter(m=>m.kind!=='staff');
  const add=(key,pri,icon,t,sub,go)=>out.push({key,pri,icon,t,sub,go});
  const vis=new Set(),lastVis={};for(const d in S.visits){(S.visits[d].ids||[]).forEach(id=>{if(!lastVis[id]||lastVis[id]<d)lastVis[id]=d})}
  (S.leads||[]).filter(pitPending).forEach(x=>add('reg:'+x.id,1,'🆕','Регистрация в My PIT ждёт одобрения',x.name+(x.match?' · похоже на '+x.match.name:''),{lead:x.id}));
  ((S.pv&&S.pv.todo)||[]).forEach(x=>add('pv:'+x.email+':'+x.updated,1,'🪪','Анкета бойца на проверке',x.name+(x.pending?' · изменения анкеты':'')+(x.pendingItems?` · достижений: ${x.pendingItems}`:''),{pv:1}));
  (S.freezes||[]).filter(r=>r.status==='pending').forEach(r=>{const m=S.members.find(z=>z.id===r.mid);add('frz:'+r.id,1,'❄️','Запрос заморозки',(m?m.name:'Боец')+' · '+fmtD(r.start)+' — '+fmtD(r.end),{m:r.mid})});
  M.forEach(m=>{const D=m.due;if(D&&D.date){if(D.date<td)add('due:'+m.id+':'+D.date+':'+td,1,'💳','Просрочена оплата',`${m.name} · ${lira(D.sum)} · обещал до ${fmtD(D.date)}`,{m:m.id});
      else if(D.date===td)add('due:'+m.id+':'+D.date,1,'💳','Сегодня обещал оплатить',`${m.name} · ${lira(D.sum)}`,{m:m.id});
      else if(D.date===tm)add('due:'+m.id+':'+D.date,2,'💳','Завтра обещал оплатить',`${m.name} · ${lira(D.sum)}`,{m:m.id})}});
  M.forEach(m=>{if(frozenNow(m))return;const d=daysLeft(m.end),lv=lastVis[m.id];
    if(d!=null&&d<0&&lv&&lv>m.end)add('debt:'+m.id+':'+lv,1,'⚠️','Ходит без оплаты',`${m.name} · абонемент истёк ${fmtD(m.end)}, был ${fmtD(lv)}`,{m:m.id});
    else if(d!=null&&d<0&&d>=-7)add('exp:'+m.id+':'+m.end,2,'⏰','Абонемент истёк — продлить',`${m.name} · ${fmtD(m.end)}`,{m:m.id});
    else if(d!=null&&d>=0&&d<=3)add('soon:'+m.id+':'+m.end,2,'⏳',d===0?'Абонемент заканчивается сегодня':`Абонемент заканчивается через ${d} дн.`,`${m.name} · до ${fmtD(m.end)}`,{m:m.id});
    if(m.left!=null&&m.left<=1&&(d==null||d>=0))add('left:'+m.id+':'+m.left,2,'🎟️',m.left<=0?'Занятия в пакете кончились':'Осталось 1 занятие',m.name,{m:m.id});
    if(m.freeze&&m.freeze.end&&(m.freeze.end===td||m.freeze.end===tm))add('fend:'+m.id+':'+m.freeze.end,3,'🔓','Заканчивается заморозка',`${m.name} · ${fmtD(m.freeze.end)}`,{m:m.id});
    if(/^\d{4}-\d{2}-\d{2}$/.test(m.dob||'')){const md=m.dob.slice(5);if(md===td.slice(5)||md===tm.slice(5))add('bd:'+m.id+':'+td.slice(0,4)+md,3,'🎂',md===td.slice(5)?'День рождения сегодня':'День рождения завтра',m.name,{m:m.id})}});
  (S.leads||[]).forEach(x=>{if(leadOpen(x)&&x.nextAt&&x.nextAt<=td)add('lnext:'+x.id+':'+x.nextAt+(x.nextAt<td?':'+td:''),x.nextAt<td?1:2,'🔔',x.nextAt<td?'Просрочено напоминание клиенту':'Сегодня напомнить о клубе',x.name+(x.thinkReason?' · '+x.thinkReason:'')+(x.phone?' · '+x.phone:''),{lead:x.id})});
  (S.leads||[]).forEach(x=>{if(x.status==='booked'&&(x.trialDate===td||x.trialDate===tm))add('trial:'+x.id+':'+x.trialDate,2,'🥊',x.trialDate===td?'Пробное сегодня':'Пробное завтра',x.name+(x.phone?' · '+x.phone:''),{lead:x.id});
    if(x.status==='new'&&!pitPending(x)&&x.ts&&Date.now()-new Date(x.ts)>864e5)add('lnew:'+x.id,2,'📞','Заявка без ответа больше суток',x.name+(x.phone?' · '+x.phone:''),{lead:x.id})});
  (S.events||[]).forEach(e=>{const d=daysLeft(e.date);if(d!=null&&d>=0&&d<=3)add('ev:'+e.id+':'+e.date,3,'📅',d===0?'Событие сегодня':`Событие через ${d} дн.`,`${e.title||''} · ${fmtD(e.date)}`,{ev:e.id})});
  return out.sort((a,b)=>a.pri-b.pri)}
function updBell(){const n=notes().filter(x=>!NREAD[x.key]).length,b=$('#bellN');if(!b)return;b.hidden=!n;b.textContent=n>99?'99+':n;$('#bell').title=n?`Уведомления: ${n}`:'Уведомлений нет';if($('.ntf'))renderNtf()}
function renderNtf(){let p=$('.ntf');const L=notes();if(!p){p=document.createElement('div');p.className='ntf';p.setAttribute('role','dialog');p.setAttribute('aria-label','Уведомления');document.body.appendChild(p)}
  const un=L.filter(x=>!NREAD[x.key]).length;
  p.innerHTML=`<h3><span>Уведомления${un?' · '+un:''}</span>${un?'<button class="btn sm" type="button" data-nall>Прочитать все</button>':''}</h3>${L.map(x=>`<div class="ni p${x.pri} ${NREAD[x.key]?'read':''}" role="button" tabindex="0" data-nk="${esc(x.key)}"><i aria-hidden="true">${x.icon}</i><span><b>${esc(x.t)}</b><small>${esc(x.sub||'')}</small></span>${NREAD[x.key]?'':`<button class="nx" type="button" data-nr="${esc(x.key)}" aria-label="Прочитано" title="Прочитано">✓</button>`}</div>`).join('')||'<div class="ne">Всё спокойно — уведомлений нет.</div>'}`;
  const until=addDays(today(),1);
  p.querySelectorAll('[data-nr]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();NREAD[b.dataset.nr]=until;saveNR();updBell()}));
  const na=p.querySelector('[data-nall]');if(na)na.addEventListener('click',()=>{L.forEach(x=>NREAD[x.key]=until);saveNR();updBell()});
  p.querySelectorAll('[data-nk]').forEach(r=>{const go=()=>{const x=L.find(z=>z.key===r.dataset.nk);if(!x)return;NREAD[x.key]=until;saveNR();closeNtf();
    if(x.go.m){S.open=x.go.m;S.drMode='view';renderDrawer()}else if(x.go.lead){S.tab='leads';render();S.ov={type:'lead',id:x.go.lead};renderOv()}else if(x.go.ev){S.tab='events';render();S.ov={type:'event',id:x.go.ev};renderOv()}else if(x.go.pv){S.tab='pv';render();scrollTo(0,0)}updBell()};
    r.addEventListener('click',go);r.addEventListener('keydown',e=>{if(e.key==='Enter')go()})})}
function closeNtf(){const p=$('.ntf');if(p)p.remove();$('#bell').setAttribute('aria-expanded','false')}
$('#bell').addEventListener('click',e=>{e.stopPropagation();if($('.ntf'))closeNtf();else{renderNtf();$('#bell').setAttribute('aria-expanded','true')}});
document.addEventListener('click',e=>{const p=$('.ntf');if(p&&!p.contains(e.target)&&e.target.id!=='bell')closeNtf()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNtf()});

document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;
  // каждая вкладка открывается с начальной страницы: без открытой группы, формы, фильтров и поиска
  Object.assign(S,{grp:null,schEdit:null,evEdit:null,expOpen:false,cashMode:undefined,shopMode:undefined,q:'',flt:'all',ciq:'',shq:'',lflt:undefined,month:null,open:null,ov:null});$('#ovHost').innerHTML='';try{localStorage.setItem('mowgli.tab',S.tab)}catch(e){}render();scrollTo(0,0)}));
try{let t=localStorage.getItem('mowgli.tab');if(t==='fin'||t==='shop')t='cash';if(['today','members','leads','pv','cash','events','sched','rep','plans'].includes(t))S.tab=t}catch(e){}
function setThm(d){document.documentElement.classList.toggle("dk",d);const b=$("#thm");b.textContent=d?"☀":"☾";b.setAttribute("aria-label",d?"Светлая тема":"Тёмная тема");try{localStorage.setItem("mowgli.theme",d?"dark":"light")}catch(e){}}
let DK=false;try{DK=localStorage.getItem("mowgli.theme")==="dark"}catch(e){}setThm(DK);$("#thm").addEventListener("click",()=>{DK=!DK;setThm(DK)});
render();

/* ===== подключение к базе ===== */
(async()=>{
  const db=window.claude&&claude.use?await claude.use('db'):null;
  if(!db){$('#st').textContent='База недоступна';S.ready={m:true,p:true,v:true,t:true};S.canWrite=false;render();
    $('#view').insertAdjacentHTML('afterbegin','<div class="banner">Нет связи с базой клуба. Проверьте интернет и обновите страницу.</div>');return}
  DB=db;
  if((window.PIT_ME||{}).role==='trainer'&&['cash','rep','plans'].includes(S.tab)){S.tab='today';render()}
  try{ASSETS=await claude.use('assets')}catch(e){ASSETS=null}
  try{const u=await claude.use('user');USER=u;if(u){try{ME=await u.id()}catch(e){}const w=await u.can('data.write');if(w===false)S.canWrite=false}}catch(e){}
  let tm=null;const rr=()=>{clearTimeout(tm);tm=setTimeout(renderBg,60)};
  const err=e=>{$('#st').textContent='Нет связи с базой';console.warn(e)};
  db.collection('members').onSnapshot(s=>{S.members=s.docs.map(d=>{const x={id:d.id,...d.data()};if(x.first&&x.last)x.name=x.first+' '+x.last;
    // несовершеннолетний с тарифом сотрудника — это боец на бесплатном безлимите
    if(x.kind==='staff'&&((x.dob&&ageOf(x.dob)<18)||(x.parent&&(x.parent.name||x.parent.mid)))){x.kind='group';if(x.plan==='staff')x.plan='free'}return x});S.ready.m=true;$('#st').textContent='Онлайн · бойцов: '+S.members.length;rr()},err);
  db.collection('payments').onSnapshot(s=>{S.payments=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.p=true;rr()},err);
  db.collection('leads').onSnapshot(s=>{S.leads=s.docs.map(d=>({id:d.id,...d.data()}));rr()},err);
  db.collection('products').onSnapshot(s=>{S.products=s.docs.map(d=>({id:d.id,...d.data()}));rr()},err);
  db.collection('events').onSnapshot(s=>{S.events=s.docs.map(d=>({id:d.id,...d.data()}));rr()},err);
  db.collection('audit').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.audit=o;if(S.tab==='rep')rr()},err);
  db.doc('club/settings').onSnapshot(s=>{S.settings=s.exists?s.data():null;rr()},err);
  db.doc('club/schedule').onSnapshot(s=>{S.sched=s.exists?s.data():null;rr()},err);
  db.collection('freezes').onSnapshot(s=>{S.freezes=s.docs.map(d=>({id:d.id,...d.data()}));rr()},err);
  db.collection('expenses').onSnapshot(s=>{S.expenses=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.e=true;rr()},err);
  db.collection('diary').onSnapshot(s=>{S.diary=s.docs.map(d=>({id:d.id,...d.data()}));rr()},err);
  db.collection('visits').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.visits=o;S.ready.v=true;rr()},err);
  db.doc('club/tariffs').onSnapshot(s=>{S.tariffs=s.exists&&Array.isArray(s.data().list)?s.data().list:null;S.ready.t=true;rr()},err);
})();
</script>
